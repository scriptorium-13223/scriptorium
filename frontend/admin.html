<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scriptorium — Admin Panel</title>
<link rel="stylesheet" href="assets/style.css" />
<style>
  body { padding-bottom: 40px; }
  .admin-header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; }
  .order-card { padding:16px; margin-bottom:14px; }
  .order-actions { display:flex; gap:8px; margin-top:12px; }
  .order-actions .btn { flex:1; padding:10px; font-size:12.5px; }
  #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  #login-card { max-width:340px; width:100%; padding:32px 24px; }
  .filter-tabs { display:flex; gap:8px; padding:0 18px 14px; overflow-x:auto; }
  .filter-tabs button { padding:8px 16px; border-radius:100px; font-size:12.5px; font-weight:600; border:1.5px solid var(--border); white-space:nowrap; }
  .filter-tabs button.active { background:var(--ink-900); color:#fff; border-color:var(--ink-900); }
</style>
</head>
<body>
<div id="toast-container"></div>

<div id="login-screen">
  <div class="card" id="login-card">
    <h2 style="font-size:20px; margin-bottom:6px; text-align:center;">🖋️ Admin Access</h2>
    <p style="font-size:12.5px; color:var(--text-muted); text-align:center; margin-bottom:20px;">Scriptorium Order Management</p>
    <div class="field-group"><label>Admin Password</label><input type="password" id="admin-secret-input" placeholder="Enter admin password" /></div>
    <button class="btn btn-primary btn-block" onclick="handleAdminLogin()">
      <span id="login-btn-label">Unlock</span>
    </button>
    <p style="font-size:11px; color:var(--text-muted); text-align:center; margin-top:16px;">Note: Telegram is the primary order system. This panel is optional and only for marking orders delivered to free up database space.</p>
  </div>
</div>

<div id="admin-app" style="display:none;">
  <div class="admin-header">
    <div class="brand" style="font-family:'Playfair Display',serif; font-size:19px; font-weight:800;">🖋️ Scriptorium Admin</div>
    <button class="btn btn-outline" style="padding:8px 14px; font-size:12.5px;" onclick="adminLogout()">Logout</button>
  </div>

  <div class="filter-tabs">
    <button class="active" data-status="" onclick="setStatusFilter('', this)">All</button>
    <button data-status="pending" onclick="setStatusFilter('pending', this)">Pending</button>
    <button data-status="processing" onclick="setStatusFilter('processing', this)">Processing</button>
  </div>

  <div class="container" id="admin-orders-list"></div>
</div>

<script src="assets/config.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/api.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
