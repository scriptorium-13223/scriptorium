<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#ff4103"/>
    </linearGradient>
  </defs>
  <!-- S formed from two overlapping arcs -->
  <path d="M132 46
           C 132 22, 108 12, 86 14
           C 60 17, 44 34, 46 54
           C 48 74, 66 82, 88 88
           C 112 95, 132 104, 134 126
           C 136 148, 118 166, 92 168
           C 68 170, 48 158, 46 138"
        fill="none" stroke="#001621" stroke-width="15" stroke-linecap="round"/>
  <!-- Feather (quill) diagonally across the top-right -->
  <path d="M118 70
           C 118 70, 132 42, 150 26
           C 162 15, 176 10, 184 8
           C 180 18, 172 30, 160 42
           C 146 56, 128 68, 112 80
           Z"
        fill="url(#featherGrad)"/>
  <path d="M184 8 C 168 20, 140 46, 112 80" fill="none" stroke="#fff4ee" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <!-- Pen nib at the base of the S -->
  <path d="M100 122 L124 150 L100 178 L76 150 Z" fill="#001621"/>
  <circle cx="100" cy="150" r="5" fill="#faf7f2"/>
  <line x1="100" y1="130" x2="100" y2="170" stroke="#faf7f2" stroke-width="2"/>
  <!-- Ink swirl beneath the nib -->
  <path d="M62 182 C 82 192, 118 192, 138 182" fill="none" stroke="#ff4103" stroke-width="3" stroke-linecap="round"/>
</svg>
